<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>make a payment</title>
    <!-- Favicons -->
    <link rel="icon" href="assets/images/favicon.svg" sizes="32x32" type="image/png" />
    <!-- Bootstrap core CSS -->
    <link href="assets/css/main.css" rel="stylesheet" />
</head>

<body>
    <main>

        <section class="invoice-form-section bg-B6EDC6 dpt-220 dpb-90">
            <div class="container">
                <div class="row">
                    <div class="col-6">
                        <div class="left-side-content d-flex flex-column justify-content-between position-sticky">
                            <div class="basker font100 leading115 text-0E3823">Pay an Invoice</div>
                            <a href="" class="rale-medium font16 leading20 text-0E3823 d-inline-block">Go back</a>
                        </div>
                    </div>
                    <div class="col-6 invoice-form">
                        <div class="col-10 mx-auto px-2">
                            <div class="dmb-40">
                                <div class="rale-medium font14 leading26 text-0E3823 dmb-15">Invoice Reference*</div>
                                <input type="text"
                                    class="rale-medium font16 leading26 text-0E3823 bg-white border-0 w-100 px-4 input"
                                    placeholder="Invoice Reference*">
                            </div>
                            <div class="dmb-40">
                                <div class="rale-medium font14 leading26 text-0E3823 dmb-15">Invoice Amount*</div>
                                <input type="text"
                                    class="rale-medium font16 leading26 text-0E3823 bg-white border-0 w-100 px-4 input"
                                    placeholder="Minimum £100.00 Maximum £5000.00…">
                            </div>
                            <div class="dmb-40">
                                <div class="rale-medium font14 leading26 text-0E3823 dmb-15">Additional Notes</div>
                                <input type="text"
                                    class="rale-medium font16 leading26 text-0E3823 bg-white border-0 w-100 px-4 input"
                                    placeholder="Minimum £100.00 Maximum £5000.00…">
                            </div>
                            <div class="dmb-40">
                                <div class="rale-medium font14 leading26 text-0E3823 dmb-15">Contact Name*</div>
                                <input type="text"
                                    class="rale-medium font16 leading26 text-0E3823 bg-white border-0 w-100 px-4 input"
                                    placeholder="Name…">
                            </div>
                            <div class="dmb-40">
                                <div class="rale-medium font14 leading26 text-0E3823 dmb-15">Email Address*</div>
                                <input type="text"
                                    class="rale-medium font16 leading26 text-0E3823 bg-white border-0 w-100 px-4 input"
                                    placeholder="Enter…">
                            </div>
                            <div class="dmb-40">
                                <div class="rale-medium font14 leading26 text-0E3823 dmb-15">Address Line*</div>
                                <input type="text"
                                    class="rale-medium font16 leading26 text-0E3823 bg-white border-0 w-100 px-4 input"
                                    placeholder="Enter…">
                            </div>
                            <div class="dmb-40">
                                <div class="rale-medium font14 leading26 text-0E3823 dmb-15">Address Line*</div>
                                <input type="text"
                                    class="rale-medium font16 leading26 text-0E3823 bg-white border-0 w-100 px-4 input"
                                    placeholder="Enter…">
                            </div>
                            <button type="submit"
                                class="btnA bg-0E3823-B6EDC6-btn rale-semibold font14 leading18 d-inline-flex align-items-center rounded-pill">Submit
                                form</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"
        integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
